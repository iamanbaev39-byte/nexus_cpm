{% extends "base.html" %}
{% block page_title %}{{ 'O‘qituvchini tahrirlash' if teacher else 'Yangi o‘qituvchi' }}{% endblock %}

{% block content %}
<div class="card" style="max-width:760px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Ism familiya</label>
        <input type="text" name="full_name" class="form-control" value="{{ teacher.full_name if teacher else '' }}" required />
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input type="text" name="phone" class="form-control" value="{{ teacher.phone if teacher else '' }}" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control" value="{{ teacher.email if teacher else '' }}" />
      </div>
      <div class="form-group">
        <label>Fan / yo‘nalish</label>
        <input type="text" name="subject" class="form-control" value="{{ teacher.subject if teacher else '' }}" required />
      </div>
      <div class="form-group">
        <label>Ish haqi turi</label>
        <select name="salary_type" class="form-control">
          <option value="fixed" {% if teacher and teacher.salary_type == 'fixed' %}selected{% endif %}>Fiks</option>
          <option value="per_lesson" {% if teacher and teacher.salary_type == 'per_lesson' %}selected{% endif %}>Darsbay</option>
        </select>
      </div>
      <div class="form-group">
        <label>Ish haqi summasi</label>
        <input type="number" step="1000" name="salary_amount" class="form-control" value="{{ teacher.salary_amount if teacher else 0 }}" required />
      </div>
      <div class="form-group">
        <label>Qabul qilingan sana</label>
        <input type="date" name="employment_date" class="form-control" value="{{ teacher.employment_date.strftime('%Y-%m-%d') if teacher and teacher.employment_date else '' }}" />
      </div>
      <div class="form-group">
        <label>Holat</label>
        <select name="status" class="form-control">
          <option value="active" {% if not teacher or teacher.status == 'active' %}selected{% endif %}>Faol</option>
          <option value="inactive" {% if teacher and teacher.status == 'inactive' %}selected{% endif %}>Nofaol</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">{{ 'Saqlash' if teacher else 'Qo‘shish' }}</button>
      <a href="{{ url_for('teachers_list') }}" class="btn btn-dark">Bekor qilish</a>
    </div>
  </form>
</div>
{% endblock %}
