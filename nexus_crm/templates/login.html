<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ brand_name }} — Kirish</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-body">
  <div class="login-card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <div class="brand-badge">N</div>
      <div>
        <h2 style="color:#0B0B0B;">{{ brand_name }}</h2>
        <p style="font-size:13px;color:#6B7280;">Education Management CRM</p>
      </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Login</label>
        <input type="text" name="username" class="form-control" placeholder="admin" autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
        Tizimga kirish
      </button>
    </form>
  </div>
</body>
</html>
